// ====== TAX MATH ======
function ordTax(brackets, taxable) {
  let tax = 0, prev = 0;
  for (const [ceil, rate] of brackets) {
    if (taxable <= prev) break;
    tax += (Math.min(taxable, ceil) - prev) * rate;
    prev = ceil;
  }
  return Math.round(tax);
}

function calc(f) {
  const t = TAX[f], i = INC[f];
  const w2Taxable = i.w2 - t.stdDed;
  const w2Tax = ordTax(t.brackets, w2Taxable);
  const w2FICA = Math.round(i.w2 * 0.0765);
  const semiAGI = i.sw2 + i.ltcg + i.qd;
  const exDed = Math.max(t.stdDed - i.sw2, 0);
  const semiOrd = Math.max(i.sw2 - t.stdDed, 0);
  const semiInv = Math.max(i.ltcg + i.qd - exDed, 0);
  const semiLTCGTax = semiOrd + semiInv > t.ltcg0 ? Math.round((semiOrd + semiInv - t.ltcg0) * 0.15) : 0;
  const semiOrdTax = ordTax(t.brackets, semiOrd);
  const semiFICA = Math.round(i.sw2 * 0.0765);
  const w2Total = w2Tax + w2FICA;
  const semiTotal = semiOrdTax + semiLTCGTax + semiFICA;
  const ltcg0RoomW2 = Math.max(t.ltcg0 - w2Taxable, 0);
  const ltcgTaxW2 = Math.round(Math.max(i.ltcg - ltcg0RoomW2, 0) * 0.15);
  const qdRoomW2 = Math.max(ltcg0RoomW2 - i.ltcg, 0);
  const qdTaxW2 = Math.round(Math.max(i.qd - qdRoomW2, 0) * 0.15);
  const ltcg0Rem = t.ltcg0 - semiOrd - semiInv;
  const convRoomW2 = Math.max(t.brackets[1][0] - w2Taxable, 0);
  const delta = w2Total - semiTotal;
  const tripleStack = t.stdDed + t.seniorDed + t.obbba;
  return {
    w2Tax, w2FICA, w2Total, w2Taxable,
    semiOrdTax, semiLTCGTax, semiFICA, semiTotal, semiAGI, semiOrd, semiInv, exDed,
    delta, portfolio: Math.round(delta / 0.04),
    ltcg0RoomW2, ltcgTaxW2, qdTaxW2, ltcg0Rem,
    convRoomW2, convRoomSemi: ltcg0Rem,
    ficaDelta: w2FICA - semiFICA,
    acaDelta: ACA_EST[f], ssDelta: SS_EST[f],
    totalAnnual: delta + ACA_EST[f],
    totalPortfolio: Math.round((delta + ACA_EST[f]) / 0.04),
    obbbaW2Save: Math.round(t.obbba * 0.12),
    seniorW2Save: Math.round(t.seniorDed * 0.12),
    tripleStack,
  };
}

const fireMeta = { shrinks: { emoji: "🔻", label: "Shrinks your number", bg: "bg-emerald-50", text: "text-emerald-600" }, protects: { emoji: "🛡️", label: "Protects a benefit", bg: "bg-amber-50", text: "text-amber-600" }, compounds: { emoji: "🔄", label: "Compounds over time", bg: "bg-blue-50", text: "text-blue-600" } };

// ====== MAGI FLOW MAP ======

    { name: "Roth Withdrawals", connects: false },
    { name: "HSA Withdrawals", connects: false },

  const tests = ["ACA MAGI", "IRMAA MAGI", "SS Combined Income", "NIIT Threshold"];
  return (
    <div className="my-4">
      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3 leading-normal">MAGI Flow Map — Which income types trigger which means tests?</p>

          <p className="text-xs font-semibold text-slate-400 mb-1 leading-normal">MEANS TESTS</p>

// ====== CARD COMPONENT ======
function Card({ card, isOpen, onToggle }) {
  const isQual = card.qual || card.delta.val === "Structural";
  return (
    <div className={`border rounded-lg mb-3 overflow-hidden transition-all ${card.age === "63plus" || card.age === "65plus" ? "border-blue-200" : card.age === "pre65" ? "border-amber-200" : "border-slate-200"}`}>
      <button onClick={onToggle} className="w-full text-left px-4 py-3 hover:bg-slate-50 transition-colors">
        <div className="flex flex-wrap items-center gap-2 mb-1">
          <span className="text-sm font-bold text-slate-700">#{card.id}</span>
          <span className="text-sm font-semibold text-slate-800 flex-1 min-w-0">{card.name}</span>
          <Badge type="age" data={ageMeta[card.age]} />
          <Badge type="fire" data={fireMeta[card.fire]} />
          {card.cliff && <span className="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-medium">⚠️ Cliff</span>}
          {card.temp && <span className="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 font-medium">⏳ Temporary</span>}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-2">
          <div className="bg-slate-50 rounded px-3 py-2">
            <p className="text-xs text-slate-400 font-medium leading-normal">👔 Full W-2</p>
            <p className="text-sm font-semibold text-slate-600 leading-normal">{card.w2.val}</p>
            <p className="text-xs text-slate-400 leading-normal">{card.w2.lbl}</p>
          </div>
          <div className="bg-emerald-50 rounded px-3 py-2">
            <p className="text-xs text-emerald-500 font-medium leading-normal">🌱 Semi-Retired</p>
            <p className="text-sm font-semibold text-emerald-700 leading-normal">{card.semi.val}</p>
            <p className="text-xs text-emerald-500 leading-normal">{card.semi.lbl}</p>
          </div>
          <div className={`rounded px-3 py-2 flex flex-col justify-center ${isQual ? "bg-blue-50" : "bg-emerald-100"}`}>
            <p className="text-xs text-slate-500 font-medium leading-normal">Delta</p>
            <p className={`text-lg font-bold ${isQual ? "text-blue-600 leading-normal" : "text-emerald-600 leading-normal"}`}>{card.delta.val}</p>
            <p className="text-xs text-slate-500 leading-normal">{card.delta.lbl}</p>
          </div>
        </div>
      </button>
      <div className="px-4 pb-2">
        <p className="text-sm text-slate-500 italic leading-normal">{card.line}</p>
      </div>
      {isOpen && (
        <div className="border-t border-slate-100 px-4 py-3 bg-slate-50 space-y-3">
          {card.cliff && card.cliffNote && (
            <div className="p-3 bg-red-50 border border-red-200 rounded text-sm text-red-700">
              <span className="font-bold">⚠️ Hard cliff: </span>{card.cliffNote}
            </div>
          )}
          {card.temp && card.tempNote && (
            <div className="p-3 bg-orange-50 border border-orange-200 rounded text-sm text-orange-700">
              <span className="font-bold">⏳ Expiration: </span>{card.tempNote}
            </div>
          )}
          {card.room && (
            <div className="p-3 bg-emerald-50 border border-emerald-200 rounded text-sm text-emerald-700">
              <span className="font-bold">Room remaining: </span>{card.room}

          <div className="text-sm text-slate-600 whitespace-pre-line leading-relaxed">{card.math}</div>
          {card.ref && (
            <div className="pt-2 border-t border-slate-200">
              <p className="text-xs text-slate-400">Deep dive: <a href={card.ref.url} className="text-emerald-600 underline hover:text-emerald-700">{card.ref.label}</a> → Retail Quant</p>
            </div>
          )}

      )}
      <div className="px-4 py-1.5 text-center">
        <button onClick={onToggle} className="text-xs text-slate-400 hover:text-slate-600 transition-colors">
          {isOpen ? "▲ Collapse" : "▼ Show math & details"}
        </button>
      </div>
    </div>
  );
}

// ====== INCOME TYPE CHEAT SHEET ======
function CheatSheet() {
  const cols = ["Fills tax brackets?", "Triggers FICA?", "ACA MAGI?", "IRMAA MAGI?", "SS taxation?"];
  return (
    <div className="mb-8">
      <h3 className="text-lg font-bold text-slate-800 mb-1">Income Type Cheat Sheet</h3>

        <table className="w-full text-xs border-collapse min-w-[600px]">

            <tr className="border-b-2 border-slate-200">
              <th className="text-left py-2 pr-3 text-slate-600 font-semibold">Income Type</th>
              {cols.map((c) => <th key={c} className="text-center py-2 px-2 text-slate-600 font-semibold">{c}</th>)}
            </tr>
          </thead>
          <tbody>
            {CHEAT.map((row) => (
              <tr key={row.type} className={`border-b border-slate-100 ${row.highlight === "good" ? "bg-emerald-50 font-semibold" : row.highlight === "warn" ? "bg-red-50" : ""}`}>
                <td className={`py-2 pr-3 font-medium ${row.highlight === "good" ? "text-emerald-700" : row.highlight === "warn" ? "text-red-700" : "text-slate-700"}`}>{row.type}</td>
                <td className="text-center py-2 px-2 text-slate-600">{row.bracket}</td>
                <td className={`text-center py-2 px-2 ${row.fica.includes("15.3") ? "text-red-600 font-bold" : row.fica === "No" ? "text-emerald-600" : "text-slate-600"}`}>{row.fica}</td>
                <td className={`text-center py-2 px-2 ${row.aca === "No" ? "text-emerald-600 font-bold" : "text-slate-600"}`}>{row.aca}</td>
                <td className={`text-center py-2 px-2 ${row.irmaa === "No" ? "text-emerald-600 font-bold" : "text-slate-600"}`}>{row.irmaa}</td>

        </table>

}

// ====== COLOR MAP (Tailwind needs full class strings) ======
const CLR = {

  amber: { border2: "border-amber-200", bg: "bg-amber-50", text7: "text-amber-700", text6: "text-amber-600", border4: "border-amber-400" },

};

// ====== RETIREMENT ROADMAP ======
function Roadmap() {
  const phases = [
    { emoji: "🟢", label: "Day 1: You quit", count: 7, color: "emerald", desc: "advantages activate" },

  );
}

// ====== SECTION SUMMARIES ======
function SectionSummary({ sec, filing }) {
  const c = C[filing];
  const t = TAX[filing];
  if (sec === 1) {
    const annual = c.delta;
    return (
      <div className="my-4 p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
        <p className="text-sm text-emerald-800 leading-normal">
          These seven advantages are available at <strong>any age</strong>. The only trigger is reducing your W-2 income enough to create room.
          The semi-retired persona earns {D(INC[filing].sw2)} part-time and still captures most of the benefit. You don't have to go to zero — you have to go <strong>strategic</strong>.
        </p>
        <p className="text-sm font-bold text-emerald-700 mt-2 leading-normal">
          Annual tax savings: {D(annual)} → {D(c.portfolio)} less portfolio at 4% rule.
        </p>
      </div>
    );
  }
  if (sec === 2) {
    return (
      <div className="my-4 p-4 bg-amber-50 border border-amber-200 rounded-lg leading-normal">
        <p className="text-sm text-amber-800 leading-normal">
          This window is finite and its value is enormous. ACA subsidies alone can be worth $10K–$25K/year depending on age and location.
          Every year between quitting and 65 where you keep your MAGI controlled is a year these advantages pay off.
          <strong> Roth withdrawals are your primary tool</strong> for spending without triggering the ACA cliff.
        </p>
        <p className="text-sm font-bold text-amber-700 mt-2 leading-normal">
          Estimated annual ACA value: ~{D(c.acaDelta)}. Over a 15-year pre-65 window: ~{D(c.acaDelta * 15)}.
        </p>
      </div>
    );
  }
  return (
    <div className="my-4 p-4 bg-blue-50 border border-blue-200 rounded-lg leading-normal">
      <p className="text-sm text-blue-800 leading-normal">
        These advantages reward the early retiree who planned ahead. If you spent your 40s and 50s doing Roth conversions in low brackets (Card 6),
        you arrive at 65 with a large Roth pool, a low MAGI, and every advantage in this section activates without effort. The early work compounds here.
      </p>
      <p className="text-sm font-bold text-blue-700 mt-2 leading-normal">
        Total deduction at 65+ ("“triple stack”"): {D(c.tripleStack)} of income fully sheltered.
      </p>
    </div>
  );
}

// ====== BOTTOM SUMMARY ======
function BottomSummary({ filing }) {
  const c = C[filing];

    <div className="mt-8 p-6 bg-gradient-to-br from-emerald-50 to-blue-50 border-2 border-emerald-200 rounded-xl">

        </div>
        <div className="flex items-start gap-3">
          <span className="text-lg">🟡</span>
          <p><strong>Pre-65 window:</strong> Preserving ACA subsidies alone is worth <strong className="text-amber-600">~{D(c.acaDelta)}/year</strong>. Over a 15-year window, that's <strong className="text-amber-600">~{D(c.acaDelta * 15)}</strong> you don't need to accumulate.</p>
        </div>
        <div className="flex items-start gap-3">
          <span className="text-lg">🟠</span>
          <p><strong>At 65+:</strong> Three more advantages unlock — and if you've been doing Roth conversions since Day 1, they activate automatically because your MAGI stays low. Total deduction shelter: <strong className="text-blue-600">{D(c.tripleStack)}</strong>.</p>

        <p className="text-lg font-bold text-slate-800 leading-normal">

        </p>
        <p className="text-3xl font-black text-emerald-600 my-2 leading-normal">{D(c.totalAnnual)}/year</p>
        <p className="text-sm text-slate-600 leading-normal">in taxes and preserved benefits</p>
        <p className="text-lg font-bold text-emerald-700 mt-2 leading-normal">
          That's {D(c.totalPortfolio)} less in your portfolio.
        </p>
        <p className="text-sm text-slate-500 mt-1 leading-normal">
          That's how the tax code accelerates your timeline.
        </p>
      </div>
    </div>
  );
}

    <div className="max-w-3xl mx-auto font-sans text-slate-800 pb-12">

            <button

          </div>
          <div className="flex-1 text-center sm:text-right">
            <p className="text-xl sm:text-2xl font-black text-emerald-600 leading-normal">{D(c.totalAnnual)}<span className="text-base font-bold">/yr saved</span></p>

            <h2 className={`text-xl font-bold ${cl.text7}`}>
              {sec.id === 1 ? "🟢" : sec.id === 2 ? "🟡" : "🟠"} Section {sec.id}: {sec.title}
